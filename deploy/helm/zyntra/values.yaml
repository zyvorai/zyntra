# Names every object (Service, Deployment, Secret) instead of <release>-zyntra,
# so a parent chart can give other services a fixed URL.
fullnameOverride: ""

image:
  repository: ghcr.io/zyvorai/zyntra
  tag: ""            # defaults to the chart appVersion
  pullPolicy: IfNotPresent
imagePullSecrets: []

# Pack shipped in the image (packs/<pack>). modelPath overrides it, for
# example a pack mounted through extraVolumes.
pack: shop
modelPath: ""
interval: 15s

# dry-run records what would be sent and sends nothing; apply executes
# approved actions. Nothing runs without a named human's approval either way.
execute: dry-run
approvalMode: local

# Credentials. Leave empty to generate them once and keep them across
# upgrades, or point existingSecret at a Secret with the same keys:
# ZYNTRA_API_KEY, ZYNTRA_SESSION_SECRET, ZYNTRA_INGEST_TOKEN, ZYNTRA_EXEC_TOKEN,
# ZYNTRA_DEPLOY_TOKEN (and optionally ZYNTRA_ADMIN_PASSWORD). The deploy token
# is what deployment tooling uses to report rollout progress; it can do nothing
# else. Per-connector ingest credentials live in the policy file instead.
# With no users in policy, the console has one local admin account. Its
# default password is Admin@321; set adminPassword before exposing the console.
auth:
  existingSecret: ""
  adminUser: admin
  adminPassword: ""
  apiKey: ""
  sessionSecret: ""
  ingestToken: ""
  execToken: ""
  deployToken: ""

# Object store. json keeps one file; sqlite keeps ontology.db (writes only what
# changed, change log on disk). Objects are held in memory at about 1.4 KB
# each, so size resources.limits.memory for the cap: 100,000 objects is roughly
# 150 MB on top of the base. A batch that would pass maxObjects is refused whole.
ontology:
  store: json                     # json | sqlite
  maxObjects: 1000000             # 0 removes the cap

# Let Kubernetes connectors in the pack read the cluster Zyntra runs in, with
# no kubectl in the image: creates a read-only ClusterRole (get and list only,
# never secrets) bound to the service account and mounts its token. Off by
# default, so a stock install can read nothing from the cluster.
kubernetes:
  inCluster: false
  # What the role may read. Narrow it to what your connectors list.
  resources: [nodes, pods, namespaces, services, deployments, statefulsets, daemonsets]
  # Let approved gravia.* actions run with no kubectl in the image: a
  # ClusterRole that may write exactly what those templates touch (Gryvia
  # priorities and GPU sharing policies; patch on Gryvia AI jobs). Actions
  # still need execute: apply to change anything; dry-run uses the API's
  # server-side dry run.
  actions: false

# Allow ontology connectors of kind "exec" (they run a command from the pack).
# Leave off unless the image carries the program and you trust the pack.
connectors:
  exec: false

# Approval policy (quorum, expiry, windows, local users) as inline YAML.
policy: ""
# Or the name of a Secret whose policy.yaml key holds the policy; it wins over
# policy. Use it when the policy carries generated values, such as the
# token_sha256 of service tokens made by a parent chart.
policyExistingSecret: ""

# Optional OpenAI-compatible model for wording, pack drafts and rule reading.
# Leave baseURL empty for the deterministic answers. For air-gapped sites point
# it at the Fabric AI gateway or an in-cluster Ollama; no key is required.
# The model never picks, ranks or runs an action.
ai:
  baseURL: ""                     # e.g. http://ollama.ai.svc:11434/v1
  model: ""                       # empty uses qwen2.5:7b-instruct
  apiKeySecret: ""                # Secret holding the key, if the endpoint needs one
  apiKeySecretKey: ZYNTRA_AI_API_KEY

# Tell people a proposal needs them. The webhook URL (a Slack or Teams incoming
# webhook is itself a secret) lives in a Secret under ZYNTRA_NOTIFY_URL, with an
# optional ZYNTRA_NOTIFY_TOKEN. Off unless secret is set.
notify:
  secret: ""
  on: ""                          # statuses to announce, e.g. "pending,executed,failed" (default pending)
  consoleURL: ""                  # makes the message a link, e.g. https://zyntra.example.com

# Plain environment, e.g. ZYNTRA_POS_URL. Only ${ZYNTRA_*} variables are
# expanded inside packs, and secrets are never expanded.
env: {}
envFrom: []

persistence:
  enabled: true
  existingClaim: ""
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 1Gi

service:
  type: ClusterIP
  port: 8080
  nodePort: null

ingress:
  enabled: false
  className: ""
  annotations: {}
  host: zyntra.example.internal
  tls: []

networkPolicy:
  enabled: false
  # Extra ingress peers allowed to reach the console and API.
  ingressFrom: []

# Test webhook inbox for trying actions without a real POS or ERP.
# Point action URLs at http://<release>-receiver:9099/<path>.
receiver:
  enabled: false
  persistence: false

serviceAccount:
  create: true
  name: ""
  automount: false

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}
extraVolumes: []
extraVolumeMounts: []
