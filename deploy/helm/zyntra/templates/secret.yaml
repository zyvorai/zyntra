{{- if not .Values.auth.existingSecret }}
{{- $name := include "zyntra.secretName" . }}
{{- $old := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "zyntra.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- range $key, $val := dict "ZYNTRA_API_KEY" .Values.auth.apiKey "ZYNTRA_SESSION_SECRET" .Values.auth.sessionSecret "ZYNTRA_INGEST_TOKEN" .Values.auth.ingestToken "ZYNTRA_EXEC_TOKEN" .Values.auth.execToken "ZYNTRA_DEPLOY_TOKEN" .Values.auth.deployToken }}
  {{- if $val }}
  {{ $key }}: {{ $val | b64enc | quote }}
  {{- else if hasKey $old $key }}
  {{ $key }}: {{ index $old $key | quote }}
  {{- else }}
  {{ $key }}: {{ randAlphaNum 48 | b64enc | quote }}
  {{- end }}
  {{- end }}
  {{- if .Values.auth.adminPassword }}
  ZYNTRA_ADMIN_PASSWORD: {{ .Values.auth.adminPassword | b64enc | quote }}
  {{- else if hasKey $old "ZYNTRA_ADMIN_PASSWORD" }}
  ZYNTRA_ADMIN_PASSWORD: {{ index $old "ZYNTRA_ADMIN_PASSWORD" | quote }}
  {{- end }}
{{- end }}
