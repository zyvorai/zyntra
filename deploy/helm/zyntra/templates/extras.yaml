{{- $fullname := include "zyntra.fullname" . }}
{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "zyntra.serviceAccountName" . }}
  labels:
    {{- include "zyntra.labels" . | nindent 4 }}
automountServiceAccountToken: {{ or .Values.serviceAccount.automount .Values.kubernetes.inCluster .Values.kubernetes.actions }}
{{- end }}
{{- if and .Values.persistence.enabled (not .Values.persistence.existingClaim) }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $fullname }}-state
  labels:
    {{- include "zyntra.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: [{{ .Values.persistence.accessMode }}]
  {{- with .Values.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
{{- end }}
{{- if and .Values.policy (not .Values.policyExistingSecret) }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fullname }}-policy
  labels:
    {{- include "zyntra.labels" . | nindent 4 }}
data:
  policy.yaml: |
    {{- .Values.policy | nindent 4 }}
{{- end }}
{{- if .Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "zyntra.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $fullname }}
                port:
                  name: http
{{- end }}
{{- if .Values.networkPolicy.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "zyntra.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "zyntra.selector" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - ports:
        - port: 8080
      {{- with .Values.networkPolicy.ingressFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}

{{- if .Values.kubernetes.inCluster }}
---
# Read-only access for Kubernetes connectors: get and list only, on exactly
# the resources listed in kubernetes.resources. Secrets are never granted.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $fullname }}-reader
  labels:
    {{- include "zyntra.labels" . | nindent 4 }}
rules:
  {{- $core := list "nodes" "pods" "namespaces" "services" "endpoints" "configmaps" "persistentvolumeclaims" "persistentvolumes" "serviceaccounts" "events" }}
  {{- $apps := list "deployments" "statefulsets" "daemonsets" "replicasets" }}
  {{- $batch := list "jobs" "cronjobs" }}
  {{- $net := list "ingresses" "networkpolicies" }}
  {{- range $group, $names := dict "" $core "apps" $apps "batch" $batch "networking.k8s.io" $net }}
  {{- $want := list }}
  {{- range $n := $names }}{{ if has $n $.Values.kubernetes.resources }}{{ $want = append $want $n }}{{ end }}{{ end }}
  {{- if $want }}
  - apiGroups: [{{ $group | quote }}]
    resources: [{{ join ", " $want }}]
    verbs: [get, list]
  {{- end }}
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $fullname }}-reader
  labels:
    {{- include "zyntra.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $fullname }}-reader
subjects:
  - kind: ServiceAccount
    name: {{ include "zyntra.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- if .Values.kubernetes.actions }}
---
# Approved gravia.* actions, run through the API with no kubectl.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $fullname }}-actions
  labels:
    {{- include "zyntra.labels" . | nindent 4 }}
rules:
  - apiGroups: [gryvia.io]
    resources: [gryviapriorities, gryviagpusharingpolicies]
    verbs: [get, create, patch, delete]
  - apiGroups: [gryvia.io]
    resources: [gryviaaijobs]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $fullname }}-actions
  labels:
    {{- include "zyntra.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $fullname }}-actions
subjects:
  - kind: ServiceAccount
    name: {{ include "zyntra.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
