name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Format check
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Unit tests
        run: go test -race ./...
      - name: Build console and binary
        run: make build
      - name: Shell lint
        run: bash -n scripts/*.sh scripts/lib/*.sh
      - name: Validate packs
        run: for p in packs/*/; do ./bin/zyntra pack validate "$p"; done
      - name: End-to-end smoke test
        run: make test-e2e
      - name: Helm chart and rendered manifest
        run: |
          make helm-lint
          ./scripts/render-k8s.sh | diff -u deploy/kubernetes/zyntra.yaml -

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build container image
        run: docker build -t zyntra:ci .
      - name: Image serves every pack
        run: |
          for p in packs/*/; do docker run --rm zyntra:ci pack validate "$p"; done
          docker run -d --name z -p 8080:8080 -e ZYNTRA_API_KEY=ci zyntra:ci
          for i in $(seq 1 20); do curl -fsS localhost:8080/healthz && break; sleep 1; done
          curl -fsS -H 'Authorization: Bearer ci' localhost:8080/api/v1/meta | grep -q '"id": *"shop"'
