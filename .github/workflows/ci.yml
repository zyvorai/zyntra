name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Format check
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Unit tests
        run: go test -race ./...
      - name: Build console and binary
        run: make build
      - name: Console tests
        run: npm test --prefix web
      - name: Shell lint
        run: bash -n scripts/*.sh scripts/lib/*.sh
      - name: Validate packs
        run: for p in packs/*/; do ./bin/zyntra pack validate "$p"; done
      - name: Connector example tests
        run: cd examples/ontology && python3 -m unittest test_connector
      - name: Assistant evaluation
        run: make eval
      - name: End-to-end smoke test
        run: make test-e2e
      - name: Helm chart and rendered manifest
        run: |
          make helm-lint
          ./scripts/render-k8s.sh | diff -u deploy/kubernetes/zyntra.yaml -

