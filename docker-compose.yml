#
# Shop pack with a local webhook receiver standing in for the POS and ERP.
#   ZYNTRA_API_KEY=$(openssl rand -hex 24) docker compose up --build
# Console: http://127.0.0.1:8080  Receiver inbox: http://127.0.0.1:9099
# Set ZYNTRA_EXECUTE=apply to send approved webhooks to the receiver;
# the default dry-run records what would be sent and sends nothing.
#
# Local model, no outbound calls after the first pull (optional):
#   ZYNTRA_AI_BASE_URL=http://ollama:11434/v1 docker compose --profile ai up -d
#   docker compose exec ollama ollama pull qwen2.5:7b-instruct
services:
  zyntra:
    build:
      context: .
      args:
        VERSION: ${ZYNTRA_VERSION:-0.4.0-dev}
    image: zyntra:${ZYNTRA_VERSION:-0.4.0-dev}
    command: ["serve", "-f", "packs/${ZYNTRA_PACK:-shop}"]
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      ZYNTRA_API_KEY: ${ZYNTRA_API_KEY:?set ZYNTRA_API_KEY}
      ZYNTRA_SESSION_SECRET: ${ZYNTRA_SESSION_SECRET:-}
      ZYNTRA_INGEST_TOKEN: ${ZYNTRA_INGEST_TOKEN:-}
      ZYNTRA_EXECUTE: ${ZYNTRA_EXECUTE:-dry-run}
      ZYNTRA_POS_URL: http://receiver:9099/pos
      ZYNTRA_ERP_URL: http://receiver:9099/erp
      ZYNTRA_AI_BASE_URL: ${ZYNTRA_AI_BASE_URL:-}
      ZYNTRA_AI_MODEL: ${ZYNTRA_AI_MODEL:-}
    volumes:
      - zyntra-state:/var/lib/zyntra
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    depends_on: [receiver]
    restart: unless-stopped

  receiver:
    image: zyntra:${ZYNTRA_VERSION:-0.4.0-dev}
    entrypoint: ["/usr/local/bin/zyntra-receiver"]
    command: ["-addr", ":9099", "-dir", "/var/lib/zyntra-inbox"]
    ports:
      - "127.0.0.1:9099:9099"
    volumes:
      - receiver-inbox:/var/lib/zyntra-inbox
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    profiles: [ai]
    volumes:
      - ollama-models:/root/.ollama
    restart: unless-stopped

volumes:
  zyntra-state:
  receiver-inbox:
  ollama-models:
